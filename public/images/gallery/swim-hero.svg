<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="galGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051D40" />
      <stop offset="60%" stop-color="#005A94" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#galGrad1)" />
  <!-- Water ripples -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.3" fill="none">
    <path d="M0,300 C300,250 600,350 900,280 C1100,230 1200,290 1200,290" />
    <path d="M0,450 C300,500 700,400 1000,470 C1150,510 1200,460 1200,460" />
    <path d="M0,600 C400,550 800,650 1200,580" />
  </g>
  <!-- Swimmer Silhouette -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="140" fill="#00B4D8" opacity="0.25" filter="blur(20px)" />
    <path d="M-120,40 C-60,0 20,20 120,-10" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.9" />
    <circle cx="140" cy="-10" r="26" fill="#FFFFFF" />
    <path d="M-40,-30 C10,-70 80,-40 130,-10" stroke="#90E0EF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.75" />
    <!-- Spray -->
    <circle cx="170" cy="-25" r="8" fill="#EBF8FF" opacity="0.7" />
    <circle cx="190" cy="-15" r="5" fill="#EBF8FF" opacity="0.6" />
    <circle cx="150" cy="-45" r="6" fill="#EBF8FF" opacity="0.5" />
  </g>
  <!-- Caption tag -->
  <rect x="50" y="700" width="300" height="50" rx="8" fill="#030A16" fill-opacity="0.8" stroke="#00B4D8" stroke-width="1" />
  <text x="75" y="732" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FBFE">LA BRACCIATA NEL MEDITERRANEO</text>
</svg>
