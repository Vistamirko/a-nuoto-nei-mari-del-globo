  <rect x="50" y="700" width="340" height="50" rx="8" fill="#030A16" fill-opacity="0.8" stroke="#00B4D8" stroke-width="1" />
  <text x="75" y="732" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FBFE">INCONTRO CON GLI STUDENTI</text>
