<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="azureSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <radialGradient id="sunDaylight" cx="75%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="azureSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0369A1" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="waterSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Bright Mediterranean Sky -->
  <rect width="1800" height="480" fill="url(#azureSky)" />
  <circle cx="1350" cy="160" r="450" fill="url(#sunDaylight)" />

  <!-- Coastline of Monte di Procida & Procida Cliffs in Mediterranean Light -->
  <g opacity="0.9">
    <!-- Monte di Procida Green & Tufo Ridge -->
    <path d="M0,450 Q300,360 600,380 T1100,440 L1100,480 L0,480 Z" fill="#0369A1" />
    <!-- Procida Island Silhouette -->
    <path d="M950,440 Q1250,380 1500,400 Q1680,370 1800,440 L1800,480 L950,480 Z" fill="#075985" />
  </g>

  <!-- Clear Azure Turquoise Sea -->
  <rect y="460" width="1800" height="640" fill="url(#azureSea)" />

  <!-- Sun Gleam on Sea Surface -->
  <g opacity="0.5">
    <ellipse cx="1350" cy="520" rx="300" ry="40" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="1350" cy="620" rx="420" ry="60" fill="#FEF08A" opacity="0.4" />
    <ellipse cx="1350" cy="760" rx="550" ry="90" fill="#38BDF8" opacity="0.3" />
  </g>

  <!-- Water Surface Ripple Waves -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.45" fill="none">
    <path d="M0,490 C300,470 650,515 1000,485 C1350,455 1650,510 1800,490" />
    <path d="M0,560 C400,530 800,590 1200,545 C1500,515 1700,565 1800,550" stroke="#E0F2FE" stroke-width="3" />
    <path d="M0,645 C350,615 850,675 1300,625 C1600,595 1750,655 1800,635" />
    <path d="M0,755 C450,715 950,805 1400,745 C1650,715 1750,775 1800,755" stroke="#BAE6FD" />
  </g>

  <!-- Swimmer (Salvatore Cimmino) with Mediterranean Daylight & Splashes -->
  <g transform="translate(850, 580)">
    <!-- Churn of Blue & White Water -->
    <ellipse cx="80" cy="50" rx="200" ry="70" fill="#38BDF8" opacity="0.35" />
    <circle cx="260" cy="45" r="18" fill="#FFFFFF" opacity="0.9" />
    <circle cx="300" cy="25" r="12" fill="#E0F2FE" opacity="0.8" />
    <circle cx="330" cy="55" r="8" fill="#BAE6FD" opacity="0.7" />

    <!-- Leading Forward Arm -->
    <path d="M-60,70 Q40,25 150,45 Q230,65 270,80" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <!-- Torso & Athletic Shoulder in Sunlight -->
    <ellipse cx="60" cy="45" rx="60" ry="34" fill="#F0F9FF" />
    <!-- Cap & Goggles -->
    <ellipse cx="120" cy="25" rx="22" ry="18" fill="#0C4A6E" />
    <ellipse cx="130" cy="24" rx="7" ry="4" fill="#38BDF8" />
    
    <!-- Streamlined Body -->
    <path d="M-10,50 Q60,10 140,20 Q200,30 240,45" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" />

    <!-- Water Spray -->
    <path d="M140,15 Q180,-10 230,10 Q260,25 250,55" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.85" />
  </g>

  <!-- Soft Bottom Transition -->
  <rect y="600" width="1800" height="500" fill="url(#azureBottomFade)" />
  <defs>
    <linearGradient id="azureBottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.95" />
    </linearGradient>
  </defs>
</svg>
