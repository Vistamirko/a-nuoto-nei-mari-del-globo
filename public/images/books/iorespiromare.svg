<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="coolBook3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#040A18" />
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#coolBook3)" rx="12" />
  
  <rect x="0" y="0" width="30" height="900" fill="#000000" opacity="0.35" />
  <line x1="30" y1="0" x2="30" y2="900" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <g transform="translate(60, 60)">
    <rect width="180" height="38" rx="8" fill="#FFFFFF" />
    <text x="90" y="24" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#040A18" text-anchor="middle">MARE</text>
  </g>

  <!-- Modern Graphic: Kinetic Breath Wave Spiral -->
  <g transform="translate(260, 360)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00E5FF" stroke-width="8" stroke-dasharray="20 15" />
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(60, 600)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#FFFFFF">MIRKO</text>
    
    <text x="0" y="55" font-family="'Syne', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">IO RESPIRO</text>
    <text x="0" y="110" font-family="'Syne', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#00E5FF" letter-spacing="-1">MARE</text>
    
    <text x="0" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" opacity="0.8">L&apos;elemento vitale che unisce l&apos;uomo alla natura</text>
  </g>
</svg>
