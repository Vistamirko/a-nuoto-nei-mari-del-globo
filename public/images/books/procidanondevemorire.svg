<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="coolBook2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB8500" />
      <stop offset="45%" stop-color="#023047" />
      <stop offset="100%" stop-color="#040A18" />
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#coolBook2)" rx="12" />
  
  <rect x="0" y="0" width="30" height="900" fill="#000000" opacity="0.35" />
  <line x1="30" y1="0" x2="30" y2="900" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <g transform="translate(60, 60)">
    <rect width="180" height="38" rx="8" fill="#FFB703" />
    <text x="90" y="24" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#040A18" text-anchor="middle">TERRITORIO</text>
  </g>

  <!-- Modern Graphic: Island & Hashtag -->
  <g transform="translate(100, 240)">
    <rect x="0" y="40" width="120" height="160" fill="#FFB703" opacity="0.8" rx="6" />
    <rect x="90" y="0" width="140" height="200" fill="#0066FF" opacity="0.9" rx="6" />
    <rect x="190" y="60" width="130" height="140" fill="#00E5FF" opacity="0.85" rx="6" />
    <text x="160" y="270" font-family="'Syne', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle">#PROCIDA</text>
  </g>

  <!-- Typography -->
  <g transform="translate(60, 600)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#FFB703">BRUNO</text>
    
    <text x="0" y="55" font-family="'Syne', 'Outfit', sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-1">#PROCIDA</text>
    <text x="0" y="110" font-family="'Syne', 'Outfit', sans-serif" font-size="36" font-weight="900" fill="#FFB703" letter-spacing="-1">NONDEVEMORIRE</text>
    
    <text x="0" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" opacity="0.8">Identità e tutela dell&apos;isola flegrea · Percorso Scuole</text>
  </g>
</svg>
